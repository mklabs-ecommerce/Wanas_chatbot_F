<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanas Gallery — conversations</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --line: #e6e2dc; --ink: #1c1a17;
    --muted: #6f6960; --accent: #7a5c3e; --bad: #b23a3a;
    --ok: #3f7d4f; --warn: #b3812f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: baseline; gap: 14px; position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header select {
    font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line);
    background: var(--panel); border-radius: 6px; color: var(--ink); cursor: pointer;
  }
  header .lbl { color: var(--muted); font-size: 12px; }
  header button {
    font: inherit; font-size: 13px; padding: 5px 12px;
    border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
    cursor: pointer; color: var(--ink);
  }
  header button:hover { border-color: var(--accent); color: var(--accent); }
  .wrap { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; min-height: calc(100vh - 53px); }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  .list { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .row {
    padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:hover { background: #f4f1ec; }
  .row.on { background: #f0ebe3; box-shadow: inset 3px 0 0 var(--accent); }
  .row .top { display: flex; gap: 8px; align-items: baseline; }
  .row .when { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .row .last {
    color: var(--muted); font-size: 13px; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .pill {
    font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line);
    color: var(--muted); background: var(--bg);
  }
  .pill.order { border-color: #cbd9c9; color: var(--ok); }
  .pill.ticket { border-color: #e3cdc1; color: var(--warn); }
  .pill.neg { border-color: #e8c4c4; color: var(--bad); }
  .pill.pos { border-color: #cbd9c9; color: var(--ok); }
  .detail { padding: 22px 26px; overflow-y: auto; }
  .detail h2 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  .detail .id { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  section { margin-top: 26px; }
  section > h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 10px; font-weight: 600;
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .card .hd { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card .hd strong { font-size: 14px; }
  .card .meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .card ul { margin: 8px 0 0; padding-left: 18px; }
  .card li { font-size: 13.5px; }
  a { color: var(--accent); }
  .msg { padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .msg:last-child { border-bottom: 0; }
  .msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .msg.user .who { color: var(--accent); }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); font-size: 13.5px; font-style: italic; }
  .warnbox { border: 1px solid #e8c4c4; background: #fdf6f6; color: var(--bad); padding: 10px 13px; border-radius: 8px; font-size: 13.5px; }
  .rtl { direction: rtl; text-align: right; }
</style>
</head>
<body>
<header>
  <h1>Wanas Gallery</h1>
  <span class="sub" id="sub">loading…</span>
  <span class="lbl" style="margin-left:auto">Sort by</span>
  <select id="sort">
    <option value="recent">Newest first</option>
    <option value="oldest">Oldest first</option>
    <option value="messages">Most messages</option>
    <option value="pieces">Most pieces ordered</option>
    <option value="orders">Most orders</option>
    <option value="tickets">Most tickets</option>
    <option value="feedback">Most feedback</option>
  </select>
  <button id="refresh">Refresh</button>
</header>
<div class="wrap">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><p class="empty">Pick a conversation on the left.</p></div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const SORT_KEY = "wanas.dashboard.sort";
const $list = document.getElementById("list");
const $detail = document.getElementById("detail");
const $sub = document.getElementById("sub");
let current = null;

const esc = s => (s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Arabic and Hebrew ranges - so Egyptian replies read right-to-left as written.
const isRTL = s => /[؀-ۿݐ-ݿࢠ-ࣿ]/.test(s || "");
const when = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString(undefined,
    { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
};

async function api(path) {
  const res = await fetch(path, { headers: { "X-Dashboard-Token": TOKEN } });
  if (!res.ok) throw new Error(res.status === 401
    ? "Wrong or missing token — open this page with ?token=…"
    : "Request failed (" + res.status + ")");
  return res.json();
}

async function loadList() {
  try {
    const sort = document.getElementById("sort").value;
    const data = await api("/dashboard/api/conversations?sort=" + encodeURIComponent(sort));
    $sub.textContent = data.count + (data.count === 1 ? " conversation" : " conversations");
    $list.innerHTML = data.conversations.map(c => {
      const pills = [];
      if (c.piece_count) pills.push(`<span class="pill order">${c.piece_count} piece${c.piece_count > 1 ? "s" : ""}</span>`);
      if (c.order_count) pills.push(`<span class="pill order">${c.order_count} order${c.order_count > 1 ? "s" : ""}</span>`);
      if (c.ticket_count) pills.push(`<span class="pill ticket">${c.ticket_count} ticket${c.ticket_count > 1 ? "s" : ""}</span>`);
      if (c.worst_sentiment === "negative") pills.push('<span class="pill neg">unhappy</span>');
      else if (c.worst_sentiment === "positive") pills.push('<span class="pill pos">happy</span>');
      else if (c.worst_sentiment) pills.push('<span class="pill">feedback</span>');
      return `<div class="row" data-id="${esc(c.conversation_id)}">
        <div class="top"><strong>${esc(c.channel)}</strong>
          <span class="pill">${c.message_count} msg</span>
          <span class="when">${when(c.last_at)}</span></div>
        <div class="last ${isRTL(c.last_message) ? "rtl" : ""}">${esc(c.last_message)}</div>
        <div class="pills">${pills.join("")}</div>
      </div>`;
    }).join("") || '<p class="empty" style="padding:16px">No conversations yet.</p>';

    $list.querySelectorAll(".row").forEach(el =>
      el.addEventListener("click", () => open(el.dataset.id)));
    if (current) markCurrent();
  } catch (e) {
    $sub.textContent = "";
    $list.innerHTML = `<div style="padding:16px"><div class="warnbox">${esc(e.message)}</div></div>`;
  }
}

function markCurrent() {
  $list.querySelectorAll(".row").forEach(el =>
    el.classList.toggle("on", el.dataset.id === current));
}

async function open(id) {
  current = id;
  markCurrent();
  $detail.innerHTML = '<p class="empty">Loading…</p>';
  try {
    const d = await api("/dashboard/api/conversations/" + encodeURIComponent(id));
    $detail.innerHTML = render(d);
  } catch (e) {
    $detail.innerHTML = `<div class="warnbox">${esc(e.message)}</div>`;
  }
}

function render(d) {
  const orders = !d.orders_readable
    ? '<div class="warnbox">Could not read orders from Shopify just now. The conversation is unaffected — try refreshing.</div>'
    : (d.orders.length ? d.orders.map(o => `
      <div class="card">
        <div class="hd">
          <strong>${esc(o.number)}</strong>
          <span class="pill">${esc(o.status)}</span>
          <span class="pill">${esc(o.payment_status)}</span>
          ${o.cash_on_delivery ? '<span class="pill">cash on delivery</span>' : ""}
          ${o.arrived ? '<span class="pill pos">arrived</span>' : ""}
          ${o.cancelled ? '<span class="pill neg">cancelled</span>' : ""}
          <span class="when" style="margin-left:auto">${esc(o.placed_on)}</span>
        </div>
        <ul>${o.items.map(i => `<li>x${i.quantity} ${esc(i.title)}${i.variant ? " (" + esc(i.variant) + ")" : ""}</li>`).join("")}</ul>
        <div class="meta">
          ${esc(o.total)}${o.delivery ? " — goods " + esc(o.subtotal) + ", delivery " + esc(o.delivery) : ""}<br>
          ${esc(o.phone || "")} ${o.email ? "· " + esc(o.email) : ""} ${o.ships_to ? "· " + esc(o.ships_to) : ""}
          ${o.admin_url ? `<br><a href="${esc(o.admin_url)}" target="_blank" rel="noopener">Open in Shopify</a>` : ""}
        </div>
      </div>`).join("") : '<p class="empty">No orders came out of this conversation.</p>');

  const feedback = d.feedback.length ? d.feedback.map(f => `
    <div class="card">
      <div class="hd"><strong>${esc(f.label)}</strong>
        ${f.order_number ? `<span class="pill">${esc(f.order_number)}</span>` : ""}
        <span class="when" style="margin-left:auto">${when(f.created_at)}</span></div>
      <div class="${isRTL(f.comment) ? "rtl" : ""}" style="margin-top:8px">${esc(f.comment)}</div>
    </div>`).join("") : '<p class="empty">No feedback from this conversation.</p>';

  const tickets = d.tickets.length ? d.tickets.map(t => `
    <div class="card">
      <div class="hd"><strong>${esc(t.reference)}</strong>
        <span class="pill">${esc(t.label)}</span>
        <span class="pill">${esc(t.status)}</span>
        ${t.order_number ? `<span class="pill">${esc(t.order_number)}</span>` : ""}
        <span class="when" style="margin-left:auto">${when(t.created_at)}</span></div>
      <div style="margin-top:8px">${esc(t.summary)}</div>
      <div class="meta">${esc(t.contact || "")}</div>
    </div>`).join("") : '<p class="empty">Nothing was escalated from this conversation.</p>';

  const messages = d.messages.length ? d.messages.map(m => `
    <div class="msg ${m.role === "user" ? "user" : ""}">
      <div class="who">${m.role === "user" ? "Customer" : "Assistant"}</div>
      <div class="body ${isRTL(m.content) ? "rtl" : ""}">${esc(m.content)}</div>
    </div>`).join("") : '<p class="empty">No messages.</p>';

  return `<h2>Conversation</h2><div class="id">${esc(d.conversation_id)}</div>
    <section><h3>Orders</h3>${orders}</section>
    <section><h3>Feedback</h3>${feedback}</section>
    <section><h3>Support tickets</h3>${tickets}</section>
    <section><h3>Transcript</h3><div class="card">${messages}</div></section>`;
}

document.getElementById("refresh").addEventListener("click", () => {
  loadList();
  if (current) open(current);
});

const $sort = document.getElementById("sort");
// Remembered, because whoever opens this page tends to want the same view each time.
$sort.value = localStorage.getItem(SORT_KEY) || "recent";
$sort.addEventListener("change", () => {
  localStorage.setItem(SORT_KEY, $sort.value);
  loadList();
});
loadList();
</script>
</body>
</html>
